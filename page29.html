<link rel="stylesheet" href="css/style.css">
	<style>
	.nm-bar{ display:flex; align-items:center; gap:10px; margin:14px 0 0; padding:10px 16px; border:1px solid rgba(7,118,181,.5); box-shadow: inset 0 0 10px rgba(7,118,181,.4), 0 0 14px rgba(47,137,207,.2); background: rgba(2,24,61,.3); flex-wrap:wrap; flex:0 0 auto; }
	.nm-bar-tit{ font-size:15px; color:#daf9ff; letter-spacing:2px; white-space:nowrap; }
	.nm-sep{ color:rgba(159,232,255,.75); font-size:14px; }
	.nm-types{ display:flex; gap:8px; flex-wrap:wrap; }
	.cs-chip{ height:30px; padding:0 14px; display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(47,137,207,.55); border-radius:15px; background:rgba(2,24,61,.7); color:rgba(223,244,255,.8); font-size:13px; cursor:pointer; user-select:none; transition:.15s; }
	.cs-chip:hover{ border-color:rgba(79,227,255,.9); color:#fff; }
	.cs-chip.on{ background:linear-gradient(180deg, rgba(47,137,207,.95), rgba(24,88,150,.95)); border-color:#7ee3ff; color:#fff; box-shadow:0 0 12px rgba(47,137,207,.55); }
	.cs-chip i{ width:8px; height:8px; border-radius:50%; display:inline-block; }
	.nm-bar .pt-time-note{ margin-left:auto; font-size:12px; color:rgba(255,255,255,.5); white-space:nowrap; }
	.nm-kpirow{ flex:0 0 auto; display:flex; gap:12px; margin:10px 0 0; align-items:stretch; }
	.nm-kpirow .nm-kpigrid{ flex:0 0 60%; margin:0; }
	.nm-kpirow .insight-bar{ flex:1; min-width:0; margin:0; }
	.nm-kpigrid .kpi-card{ padding:9px 14px; }
	.nm-kpigrid .kc-val{ font-size:26px; }
	.nm-kpigrid .kc-val small{ font-size:13px; font-weight:400; color:rgba(159,232,255,.75); margin-left:3px; }
	.nm-body{ flex:1; min-height:0; display:flex; gap:12px; margin:10px 0 10px; }
	.nm-chartbox{ flex:2 1 0; min-width:0; min-height:0; display:flex; flex-direction:column; border:1px solid rgba(7,118,181,.5); box-shadow: inset 0 0 10px rgba(7,118,181,.3), 0 0 12px rgba(47,137,207,.15); background:rgba(2,24,61,.25); padding:6px 12px 8px; }
	.nm-chart{ flex:1; min-height:0; }
	.nm-tblbox{ flex:3 1 0; min-width:0; min-height:0; display:flex; flex-direction:column; border:1px solid rgba(7,118,181,.5); box-shadow: inset 0 0 10px rgba(7,118,181,.3), 0 0 10px rgba(47,137,207,.15); background:rgba(2,24,61,.25); padding:8px 12px 10px; }
	.nm-tblbox .pt-tbl-wrap{ flex:1; min-height:0; max-height:none; }
	.nm-tag{ display:inline-block; padding:1px 7px; border-radius:9px; font-size:12px; white-space:nowrap; }
	.fs-body .nm-chart{ width:100%; height:100%; }
	</style>
	<script>window.PAGE_KEY='ins_name';</script>

</div><div class="head clearfix">
		<h1><img class="head-logo" src="images/logo-white.png" alt="驯鹿生物">驯鹿生物大数据监控平台</h1>
		<div class="head-left">
			<div class="update">数据更新时间 <span id="nmUpd">--</span></div>
			<button class="menu-btn" id="menuBtn" type="button"><i>☰</i><span>网页导航</span></button>
		</div>
		<div class="tm-wrap">
			<div class="time" id="showTime">--</div>
			<div class="weather" id="weather">上海 --</div>
		</div>
		<script>
		var t = null;
		t = setTimeout(time, 1000);
		function time() {
			clearTimeout(t);
			var dt = new Date();
			var y = dt.getFullYear(), mt = dt.getMonth() + 1, day = dt.getDate();
			var h = dt.getHours(), m = dt.getMinutes(), s = dt.getSeconds();
			document.getElementById("showTime").innerHTML = y + "/" + mt + "/" + day + " " + h + ":" + m + ":" + s + "";
			t = setTimeout(time, 1000);
		}
		</script>
	</div>
	<div class="mainbox page-fill">
		<div class="nm-bar">
			<span class="nm-bar-tit">时间区间</span>
			<select id="nmY1" class="pt-sel" title="起始年"></select>
			<select id="nmM1" class="pt-sel" title="起始月"></select>
			<span class="nm-sep">~</span>
			<select id="nmY2" class="pt-sel" title="结束年"></select>
			<select id="nmM2" class="pt-sel" title="结束月"></select>

	$(function () {
