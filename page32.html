	<style>
	.pa-bar{ display:flex; align-items:center; gap:10px; margin:14px 0 0; padding:10px 16px; border:1px solid rgba(7,118,181,.5); box-shadow: inset 0 0 10px rgba(7,118,181,.4), 0 0 14px rgba(47,137,207,.2); background: rgba(2,24,61,.3); flex-wrap:wrap; flex:0 0 auto; }
	.pa-bar-tit{ font-size:15px; color:#daf9ff; letter-spacing:2px; white-space:nowrap; }
	.pa-sep{ color:rgba(159,232,255,.75); font-size:14px; }

	.pa-kpigrid{ flex:0 0 auto; margin:10px 0 0; flex-wrap:nowrap; }
	.pa-kpigrid .kpi-card{ padding:9px 14px; }
	.pa-kpigrid .kc-val{ font-size:26px; }
	.pa-kpigrid .kc-val small{ font-size:13px; font-weight:400; color:rgba(159,232,255,.75); margin-left:3px; }
	.pa-charts{ flex:1; min-height:0; display:flex; gap:12px; margin:10px 0 10px; }
	.pa-chartbox{ flex:1 1 0; min-width:0; min-height:0; display:flex; flex-direction:column; border:1px solid rgba(7,118,181,.5); box-shadow: inset 0 0 10px rgba(7,118,181,.3), 0 0 12px rgba(47,137,207,.15); background:rgba(2,24,61,.25); padding:6px 10px 8px; }
	.pa-chart{ flex:1; min-height:0; }
	.pa-tblbox{ flex:1; min-height:0; display:flex; flex-direction:column; border:1px solid rgba(7,118,181,.5); box-shadow: inset 0 0 10px rgba(7,118,181,.3), 0 0 10px rgba(47,137,207,.15); background:rgba(2,24,61,.25); padding:8px 12px 10px; margin-bottom:10px; }
	.pa-tblbox .pt-tbl-wrap{ flex:1; min-height:0; max-height:none; }
	.pa-chip{ height:28px; padding:0 12px; display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(47,137,207,.55); border-radius:14px; background:rgba(2,24,61,.7); color:rgba(223,244,255,.8); font-size:13px; cursor:pointer; user-select:none; }
	.pa-chip.on{ background:linear-gradient(180deg, rgba(47,137,207,.95), rgba(24,88,150,.95)); border-color:#7ee3ff; color:#fff; }
	.pa-chip i{ width:8px; height:8px; border-radius:50%; display:inline-block; }
	.pa-search{ height:30px; padding:0 10px; width:190px; background:rgba(2,24,61,.8); border:1px solid rgba(47,137,207,.7); border-radius:6px; color:#fff; font-size:13px; outline:none; }
	.pa-search::placeholder{ color:rgba(255,255,255,.35); }
	.pa-tag{ display:inline-block; padding:1px 7px; border-radius:9px; font-size:12px; white-space:nowrap; }
	.pa-note{ max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	.fs-body .pa-chart{ width:100%; height:100%; }
	</style>

</div><div class="head clearfix">

		<div class="head-left">
			<div class="update">数据更新时间 <span id="paUpd">--</span></div>
			<button class="menu-btn" id="menuBtn" type="button"><i>☰</i><span>网页导航</span></button>
		</div>
		<div class="tm-wrap">
			<div class="time" id="showTime">--</div>
			<div class="weather" id="weather">上海 --</div>
		</div>
		<script>
		var t = null;
		t = setTimeout(time, 1000);
		function time() {
			clearTimeout(t);
			var dt = new Date();
			var y = dt.getFullYear(), mt = dt.getMonth() + 1, day = dt.getDate();
			var h = dt.getHours(), m = dt.getMinutes(), s = dt.getSeconds();
			document.getElementById("showTime").innerHTML = y + "/" + mt + "/" + day + " " + h + ":" + m + ":" + s + "";
			t = setTimeout(time, 1000);
		}
		</script>
	</div>
