<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>福可苏业绩总览 · SCOE 医院数据</title>
<script type="text/javascript" src="js/jquery.js"></script>
<script type="text/javascript" src="js/data.js"></script>
<script type="text/javascript" src="js/nav.js"></script>
<script type="text/javascript" src="js/palette.js"></script>
<script type="text/javascript" src="js/pt-common.js"></script>
<script type="text/javascript" src="js/echarts.min.js"></script>
<script type="text/javascript" src="js/coe_common.js"></script>
<link rel="stylesheet" href="css/style.css">
	<style>
	/* 2026-10-13：4 张卡片占半宽 + 右侧 YTD 贡献折线图；搜索控件并入时间控制行。
	   注意：**不要给表格 id 设 min-height / max-height / height** —— id 级尺寸会压过 .page-fill
	   的 flex 链（.pt-tables → .pt-tbl-row → .pt-tbl-col → .pt-tbl-wrap 逐级 flex），
	   浏览器缩放或窗口变矮时可用高度小于该固定值，表格就会溢出容器下边框（§10.4）。 */
	.coe-time{ flex-wrap: wrap; row-gap: 8px; margin-bottom: 0; }
	.coe-time .coe-search{ margin: 0; flex: 0 0 auto; }
	/* 模块纵向间距统一 12px：筛选→卡片区 / 卡片区→AI 总结 / AI 总结→表格；省下的高度全给表格 */
	.coe-mid{ display: flex; gap: 12px; margin: 12px 0 0; flex: 0 0 auto; min-height: 150px; }
	.coe-mid-l{ flex: 0 0 50%; min-width: 0; display: flex; flex-direction: column; }
	.coe-mid-l .kpi-grid{ flex: 1; margin: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 10px; }
	.coe-mid-l .kpi-card{ display: flex; flex-direction: column; justify-content: center; min-width: 0; }
	.coe-mid-r{ flex: 1 1 50%; min-width: 0; }
	.coe-mid-r .sec-head{ margin-bottom: 4px; }
	.coe-chart{ flex: 1; min-height: 120px; min-width: 0; }
	#coeAI{ margin: 12px 0 0; }
	.page-fill .pt-tables{ margin-top: 12px; margin-bottom: 12px; }
	</style>
	<script>window.PAGE_KEY='coe_scoe';</script>
	<script type="text/javascript" src="js/users.js"></script>
	<script type="text/javascript" src="js/auth.js"></script>
</head>
<body>
	<div class="login-mask" id="loginMask">
	<div class="login-body">
		<div class="login-left"><img src="images/login29/qiu.png" alt=""></div>
		<div class="login-center">
			<div class="login-shuzibg"></div>
			<div class="login-title">
				<img class="login-logo" src="images/logo-white.png" alt="驯鹿生物">
				<p class="login-title-main">驯鹿生物大数据监控平台</p>
				<p class="login-title-sub">登录页</p>
			</div>
			<div class="login-card">
				<div class="login-welcome">欢迎登录系统!</div>
				<div class="login-input">
					<div class="login-ico"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt=""></div>
					<input type="text" id="loginUser" placeholder="请输入账号" value="administrator" autocomplete="off">
				</div>
				<div class="login-input">
					<div class="login-ico"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt=""></div>
					<input type="password" id="loginPwd" placeholder="密码" autocomplete="off">
				</div>
				<label class="login-remember"><input type="checkbox" id="loginRemember"><span>记住密码</span></label>
				<div class="login-err" id="loginErr"></div>
				<div class="login-btn" id="loginBtn"><span>登 录</span></div>
			</div>
		</div>
	</div>
	<div class="login-bolang"></div>
</div><div class="head clearfix">
		<h1><img class="head-logo" src="images/logo-white.png" alt="驯鹿生物">驯鹿生物大数据监控平台</h1>
		<div class="head-left">
			<div class="update">数据更新时间 <span id="coeUpd">--</span></div>
			<button class="menu-btn" id="menuBtn" type="button"><i>☰</i><span>网页导航</span></button>
		</div>
		<div class="tm-wrap">
			<div class="time" id="showTime">--</div>
			<div class="weather" id="weather">上海 --</div>
		</div>
		<script>
		var t = null;
		t = setTimeout(time, 1000);
		function time() {
			clearTimeout(t);
			var dt = new Date();
			var y = dt.getFullYear(), mt = dt.getMonth() + 1, day = dt.getDate();
			var h = dt.getHours(), m = dt.getMinutes(), s = dt.getSeconds();
			document.getElementById("showTime").innerHTML = y + "/" + mt + "/" + day + " " + h + ":" + m + ":" + s + "";
			t = setTimeout(time, 1000);
		}
		</script>
	</div>
	<div class="mainbox page-fill">
		<div class="pt-time coe-time">
			<span class="pt-time-tit">时间控制</span>
			<select id="coeY" class="pt-sel" title="年份"></select>
			<select id="coeM" class="pt-sel" title="月份"></select>
			<div class="coe-search" id="coeSearch"></div>
			<span class="pt-time-note">YTD = 当年 1 月～所选月累计；贡献比例分母为全盘（含 Others）</span>
		</div>
		<div class="coe-mid">
			<div class="coe-mid-l">
				<div class="kpi-grid" id="coeCards"></div>
			</div>
			<div class="pt-tbl-col coe-mid-r">
				<div class="sec-head">YTD 贡献占比<span class="sub">横轴年份 · 各点均截至所选月</span></div>
				<div class="coe-chart" id="coeContrib"></div>
			</div>
		</div>
		<div class="insight-bar" id="coeAI"></div>
		<div class="pt-tables">
			<div class="pt-tbl-row">
				<div class="pt-tbl-col pt-tbl-full">
					<div class="sec-head">SCOE 医院数据 <span class="coe-cnt" id="coeCnt"></span><button class="map-fs" type="button" data-fs="coeTbl" data-title="SCOE 医院数据">⛶</button></div>
					<div class="pt-tbl-wrap" id="coeTbl"></div>
				</div>
			</div>
		</div>
	</div>
	<!-- 地图放大全屏 -->
	<div class="fs-mask" id="fsMask" style="display:none;">
		<div class="fs-head">
			<span class="fs-title" id="fsTitle">--</span>
			<button class="fs-close" id="fsClose" type="button">×</button>
		</div>
		<div class="fs-body" id="fsBody"></div>
	</div>
	<!-- 网页导航菜单 -->
	<div class="menu-mask" id="menuMask" style="display:none;">
		<div class="menu-panel">
			<div class="menu-panel-head">
				<span class="menu-panel-tit">网页导航</span>
				<button class="menu-close" id="menuClose" type="button">×</button>
			</div>
			<ul class="menu-list" id="menuList"></ul>
			<div class="menu-pager" id="menuPager"></div>
		</div>
	</div>

	<script>
	// 当天上海天气与温度
	(function () {
		var wEl = document.getElementById('weather');
		var WSYM = {0:'☀',1:'☀',2:'⛅',3:'☁',45:'☁',48:'☁',51:'☔',53:'☔',55:'☔',56:'☔',57:'☔',61:'☔',63:'☔☔',65:'☔☔☔',66:'☔☔',67:'☔☔',71:'❄',73:'❄',75:'❄',77:'❄',80:'☔',81:'☔☔',82:'☔☔☔',85:'❄',86:'❄',95:'⛈',96:'⛈',99:'⛈'};
		fetch('https://api.open-meteo.com/v1/forecast?latitude=31.23&longitude=121.47&current=temperature_2m,weather_code&timezone=Asia%2FShanghai')
			.then(function (r) { return r.json(); })
			.then(function (d) {
				var t = Math.round(d.current.temperature_2m);
				wEl.innerHTML = '上海 ' + (WSYM[d.current.weather_code] || '--') + ' ' + t + '℃';
			})
			.catch(function () { wEl.innerHTML = '上海 --'; });
	})();
	</script>
	<script>
	// 数据更新时间
	$(function () {
		var B = (typeof BOARD_DATA !== 'undefined') ? BOARD_DATA : null;
		$('#coeUpd').text((B && B.UPDATED) ? B.UPDATED : '--');
	});
	</script>
	<script type="text/javascript" src="js/excel_export.js"></script>
	<script type="text/javascript" src="js/fs.js"></script>
	<!-- 左侧悬浮导航栏 -->
	<div class="side-nav" id="sideNav"></div>
</body>
</html>
