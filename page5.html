		<script>
		var t = null;
		t = setTimeout(time, 1000);
		function time() {
			clearTimeout(t);
			var dt = new Date();
			var y = dt.getFullYear(), mt = dt.getMonth() + 1, day = dt.getDate();
			var h = dt.getHours(), m = dt.getMinutes(), s = dt.getSeconds();
			document.getElementById("showTime").innerHTML = y + "/" + mt + "/" + day + " " + h + ":" + m + ":" + s + "";
			t = setTimeout(time, 1000);
		}
		</script>

	<script>
	// 页面访问密码校验（sessionStorage 共享，登录一次全站放行）
	(function () {
		var HASH = 'fcde78c0a777ada04fec4ed613421feb59ee71e70608fa7bf53c386970395c66';
		var mask = document.getElementById('loginMask');
		if (sessionStorage.getItem('board_authed') === '1') { if (mask) mask.style.display = 'none'; return; }
		function sha256(text) {
			return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (h) {
				return Array.prototype.map.call(new Uint8Array(h), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
			});
		}
		function check() {
			var pwd = document.getElementById('loginPwd');
			sha256(pwd.value).then(function (h) {
				if (h === HASH) {
					sessionStorage.setItem('board_authed', '1');
					mask.style.display = 'none';
				} else {
					document.getElementById('loginErr').textContent = '密码错误，请重试';
					pwd.value = '';
					pwd.focus();
				}
			}).catch(function () {
				document.getElementById('loginErr').textContent = '当前环境不支持加密（请用 http/https 访问）';
			});
		}
		document.getElementById('loginBtn').addEventListener('click', check);
		document.getElementById('loginPwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
		document.getElementById('loginPwd').focus();
	})();
	</script>
	<script>
	// 当天上海天气与温度
	(function () {
		var wEl = document.getElementById('weather');
		var WSYM = {0:'☀',1:'☀',2:'⛅',3:'☁',45:'☁',48:'☁',51:'☔',53:'☔',55:'☔',56:'☔',57:'☔',61:'☔',63:'☔☔',65:'☔☔☔',66:'☔☔',67:'☔☔',71:'❄',73:'❄',75:'❄',77:'❄',80:'☔',81:'☔☔',82:'☔☔☔',85:'❄',86:'❄',95:'⛈',96:'⛈',99:'⛈'};
		fetch('https://api.open-meteo.com/v1/forecast?latitude=31.23&longitude=121.47&current=temperature_2m,weather_code&timezone=Asia%2FShanghai')
			.then(function (r) { return r.json(); })
			.then(function (d) {
				var t = Math.round(d.current.temperature_2m);
				wEl.innerHTML = '上海 ' + (WSYM[d.current.weather_code] || '--') + ' ' + t + '℃';
			})
			.catch(function () { wEl.innerHTML = '上海 --'; });
	})();
	</script>
	<script>
	// 数据更新时间
	$(function () {

		$('#p5Upd').text((B && B.UPDATED) ? B.UPDATED : '--');
	});
	</script>
