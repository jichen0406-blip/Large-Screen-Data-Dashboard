</div><div class="head clearfix">
		<h1><img class="head-logo" src="images/logo-white.png" alt="驯鹿生物">驯鹿生物大数据监控平台</h1>
		<div class="head-left">
			<div class="update">数据更新时间 <span id="p35Upd">--</span></div>
			<button class="menu-btn" id="menuBtn" type="button"><i>☰</i><span>网页导航</span></button>
		</div>
		<div class="tm-wrap">
			<div class="time" id="showTime">--</div>
			<div class="weather" id="weather">上海 --</div>
		</div>
		<script>
		var t = null;
		t = setTimeout(time, 1000);
		function time() {
			clearTimeout(t);
			var dt = new Date();
			var y = dt.getFullYear(), mt = dt.getMonth() + 1, day = dt.getDate();
			var h = dt.getHours(), m = dt.getMinutes(), s = dt.getSeconds();
			document.getElementById("showTime").innerHTML = y + "/" + mt + "/" + day + " " + h + ":" + m + ":" + s + "";
			t = setTimeout(time, 1000);
		}
		</script>
	</div>
	<div class="mainbox page-fill">
		<div class="pt-time">
			<span class="pt-time-tit">年月控制</span>
			<select id="p35y" class="pt-sel" title="年份"></select>
			<select id="p35m" class="pt-sel" title="月份"></select>
			<span class="pt-time-note">仅统计已执行（按计划执行 / 延期提前执行），不含未执行与未来预约</span>
		</div>
		<div class="cart-stack cart-stack-detail">
			<div class="pt-tbl-col">
				<div class="sec-head">COS 每日工作量<span class="sub">按实际执行日落格</span><span id="p35calstat"></span><button class="map-fs" type="button" data-fs="p35calwrap" data-title="COS 每日工作量">⛶</button></div>
				<div class="pt-tbl-wrap" id="p35calwrap" data-xls-skip><div id="p35cal"></div></div>
			</div>
			<div class="pt-tbl-col">
				<div class="sec-head" data-xls="p35tbl" data-xls-title="COS 当月工作量">COS 当月汇总<span class="sub">只计已执行</span><span id="p35tblstat"></span><button class="map-fs" type="button" data-fs="p35tbl" data-title="COS 当月汇总">⛶</button></div>

			</div>
		</div>

	</div>
	<!-- 网页导航菜单 -->

		</div>
	</div>

	<script>
	// 当天上海天气与温度
	(function () {
		var wEl = document.getElementById('weather');
		var WSYM = {0:'☀',1:'☀',2:'⛅',3:'☁',45:'☁',48:'☁',51:'☔',53:'☔',55:'☔',56:'☔',57:'☔',61:'☔',63:'☔☔',65:'☔☔☔',66:'☔☔',67:'☔☔',71:'❄',73:'❄',75:'❄',77:'❄',80:'☔',81:'☔☔',82:'☔☔☔',85:'❄',86:'❄',95:'⛈',96:'⛈',99:'⛈'};
		fetch('https://api.open-meteo.com/v1/forecast?latitude=31.23&longitude=121.47&current=temperature_2m,weather_code&timezone=Asia%2FShanghai')
			.then(function (r) { return r.json(); })
			.then(function (d) {
				var t = Math.round(d.current.temperature_2m);
				wEl.innerHTML = '上海 ' + (WSYM[d.current.weather_code] || '--') + ' ' + t + '℃';
			})
			.catch(function () { wEl.innerHTML = '上海 --'; });
	})();
	</script>
	<script>
	// 数据更新时间
	$(function () {
		var B = (typeof BOARD_DATA !== 'undefined') ? BOARD_DATA : null;
		$('#p35Upd').text((B && B.UPDATED) ? B.UPDATED : '--');
	});
	</script>
